# Nginx reverse proxy for the ISKCON Food Inventory app.
# The Node app (PM2) serves both the API (/api/v1) and the built SPA.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/iskcon
#          sudo ln -s /etc/nginx/sites-available/iskcon /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:  sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Static assets are served by the Node app with long cache headers.
    # If you prefer Nginx to serve them directly, uncomment:
    # location /assets/ {
    #     alias /var/www/iskcon/frontend/dist/assets/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
